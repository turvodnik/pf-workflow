# pf-secret-rules.toml — secret-scan rules for the commit gate (T-088).
#
# Why our own config on top of the default one. The T-074 gate showed that the
# default gitleaks "no leaks found" is weaker than it sounds. Checked by hand
# on 2026-09-11 on a dummy repository (gitleaks 8.30.1, nine key classes of
# our providers): the default does NOT catch `AKIA…EXAMPLE` (its own
# allowlist), does NOT catch Anthropic `sk-ant-…` keys at all, and does NOT
# catch DataForSEO pairs or SerpApi keys. So three of our paid providers are
# not covered by the default in any way.
#
# A TRAP that cost half an hour (written down so nobody rediscovers it): the
# global allowlist of the default config applies to OUR rules too. A fixture
# made of repeated characters ("eeee…", "ffff…") gets eaten by it — the rule
# looks broken though it works. So the fixtures in tests/ are pseudo-random
# (a fixed seed), not "aaaa".

[extend]
useDefault = true
# The only switch-off. The default aws-access-token rule carries an allowlist
# of canonical "examples" (AKIA…EXAMPLE and kin; it is deliberately NOT written
# out in full here — this very gate tripped on it while the package was being
# written) — exactly defect no. 2 of T-088: a real key pasted into documentation
# "as an example" passes silently. Below is the same rule WITHOUT exceptions;
# the regexp is the same, the coverage is not narrowed (checked with both
# fixtures: the "example" and a random key).
disabledRules = ["aws-access-token"]

# ── AWS ────────────────────────────────────────────────────────────────────
# Why our own: see disabledRules above. The prefixes are Amazon's full set
# (AKIA — long-lived, ASIA — temporary STS, ABIA/ACCA/A3T — service ones).
[[rules]]
id = "pf-aws-access-key-id"
description = "AWS Access Key ID (без allowlist-исключений)"
regex = '''(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}'''
keywords = ["akia", "asia", "abia", "acca", "a3t"]

# ── Anthropic ──────────────────────────────────────────────────────────────
# Why our own: the default catches NOTHING with `sk-ant-` (checked). This is our
# main paid API — the hole was the most expensive one found.
[[rules]]
id = "pf-anthropic-api-key"
description = "Anthropic API key (sk-ant-…)"
regex = '''sk-ant-[A-Za-z0-9_\-]{24,}'''
keywords = ["sk-ant-"]

# ── DataForSEO ─────────────────────────────────────────────────────────────
# Why our own: the default does not catch it (a login/password, not a token of
# a known shape). We catch it by the variable name next to the value: a
# DataForSEO "secret" is an ordinary password, the string alone does not tell it.
[[rules]]
id = "pf-dataforseo-credential"
description = "DataForSEO login/password"
regex = '''(?i)dataforseo[_\-.]?(?:api)?[_\-.]?(?:login|password|key|token|pass)["'`]?\s*[:=]\s*["'`]?([A-Za-z0-9!@#$%^&*()_+=\-./]{8,})'''
secretGroup = 1
keywords = ["dataforseo"]

# ── SerpApi ────────────────────────────────────────────────────────────────
# Why our own: the default does not catch it (the key is just 64 hex characters,
# indistinguishable from a hash). The same trick: the variable name next to the value.
[[rules]]
id = "pf-serpapi-key"
description = "SerpApi key"
regex = '''(?i)serp[_\-.]?api[_\-.]?(?:key|token|secret)["'`]?\s*[:=]\s*["'`]?([A-Za-z0-9]{16,})'''
secretGroup = 1
keywords = ["serpapi", "serp_api", "serp-api"]

# ── GitHub / Slack / Telegram ──────────────────────────────────────────────
# Why our own, although the default DOES catch these classes (github-pat,
# github-oauth, slack-bot-token, slack-user-token, telegram-bot-api-token —
# checked): these are our working providers (§6 of the rules — repositories
# github.com/turvodnik), and depending on someone else's config for them, one
# that is updated without our knowledge, is the same hole as with AWS, only
# deferred. The price is named honestly: a real leak of such a key gives TWO
# findings instead of one (our rule + the default one). It blocks the commit
# the same way, and a false positive will need two ledger entries — a
# deliberate trade in favour of independence.
[[rules]]
id = "pf-github-token"
description = "GitHub token (ghp_/gho_/ghu_/ghs_/ghr_)"
regex = '''gh[pousr]_[A-Za-z0-9]{36,}'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]

[[rules]]
id = "pf-slack-token"
description = "Slack token (xoxb-/xoxp-/xoxa-/xoxr-/xoxs-)"
regex = '''xox[abprs]-[0-9A-Za-z-]{12,}'''
keywords = ["xoxb-", "xoxp-", "xoxa-", "xoxr-", "xoxs-"]

[[rules]]
id = "pf-telegram-bot-token"
description = "Telegram bot token"
regex = '''\b\d{8,10}:AA[\w-]{33}\b'''
keywords = [":aa"]
