name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    # 20, not 10: the sub-harnesses added 2026-09-20 (council, pf-run)
    # add ~90 s on a Mac; the codex-review harness alone
    # is ~4 min there, and the GitHub runner is slower.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: bash tests/run.sh
        run: bash tests/run.sh
